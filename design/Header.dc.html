<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Site header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<header style="font-family: 'Nunito', system-ui, sans-serif; color: #17324D; background: #FFFFFF; border-bottom: 1px solid #E3EEF0; position: relative; z-index: 40">
  <div style="max-width: 1200px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
    <a href="Main.dc.html" aria-label="Dr. Vira Bolok, MD — home" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #17324D">
      <img src="images/logo-dark.webp" alt="Dr. Vira" style="height: 44px; width: auto; display: block">
      <span class="dv-hcta" style="padding-left: 12px; border-left: 1px solid #DCE9EB; font-size: 13px; color: #4A5D70; font-weight: 700; line-height: 1.3">Pediatrics &amp;<br>Neonatology</span>
    </a>
    <nav class="dv-navlinks" aria-label="Main" style="display: flex; gap: 2px; align-items: center">
      <a href="Main.dc.html" aria-current="{{cur.home}}" style="{{st.home}}">Home</a>
      <a href="About.dc.html" aria-current="{{cur.about}}" style="{{st.about}}">About</a>
      <div style="position: relative">
        <button type="button" onClick="{{toggleServices}}" aria-expanded="{{servicesExpanded}}" aria-controls="dv-services-menu" style="{{st.services}} border: none; font-family: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 6px">
          Services
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{chevStyle}}"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>
        <sc-if value="{{servicesOpen}}" hint-placeholder-val="{{ false }}">
          <div id="dv-services-menu" style="position: absolute; top: calc(100% + 10px); left: 50%; transform: translateX(-50%); width: 320px; padding: 10px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E1ECEE; box-shadow: 0 20px 50px rgba(23, 50, 77, 0.16); display: flex; flex-direction: column; gap: 2px; z-index: 60">
            <sc-for list="{{services}}" as="s" hint-placeholder-count="5">
              <a href="{{s.href}}" onMouseEnter="{{s.enter}}" onMouseLeave="{{s.leave}}" onFocus="{{s.enter}}" onBlur="{{s.leave}}" style="{{s.itemStyle}}">
                {{s.title}}
              </a>
            </sc-for>
            <a href="Services.dc.html" style="display: flex; align-items: center; justify-content: space-between; min-height: 44px; margin-top: 4px; padding: 8px 12px; border-top: 1px solid #EEF4F5; text-decoration: none; color: #0D7A80; font-weight: 800; font-size: 14px">All Services<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg></a>
          </div>
        </sc-if>
      </div>
      <a href="FAQ.dc.html" aria-current="{{cur.faq}}" style="{{st.faq}}">FAQ</a>
      <a href="Blog.dc.html" aria-current="{{cur.blog}}" style="{{st.blog}}">Blog</a>
      <a href="Contact.dc.html" aria-current="{{cur.contact}}" style="{{st.contact}}">Contact</a>
    </nav>
    <div style="display: flex; gap: 10px; align-items: center">
      <a href="Book.dc.html" aria-current="{{cur.book}}" style="display: inline-flex; align-items: center; min-height: 46px; padding: 0 22px; border-radius: 999px; background: #0D7A80; color: #FFFFFF; font-weight: 800; font-size: 15px; text-decoration: none; white-space: nowrap">Book Appointment</a>
      <button class="dv-menu" type="button" onClick="{{toggleMenu}}" aria-expanded="{{menuExpanded}}" aria-controls="dv-mobile-menu" aria-label="{{menuLabel}}" style="width: 46px; height: 46px; border-radius: 14px; border: 1px solid #D5E5E7; background: #FFFFFF; color: #17324D; align-items: center; justify-content: center; cursor: pointer">
        <sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
        </sc-if>
        <sc-if value="{{menuClosed}}" hint-placeholder-val="{{ true }}">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="17" x2="20" y2="17"></line></svg>
        </sc-if>
      </button>
    </div>
  </div>

  <sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
    <nav id="dv-mobile-menu" aria-label="Mobile" style="border-top: 1px solid #E3EEF0; background: #FFFFFF; padding: 12px 20px 22px; display: flex; flex-direction: column; gap: 2px; box-shadow: 0 18px 40px rgba(23, 50, 77, 0.12)">
      <a href="Main.dc.html" style="{{mst.home}}">Home</a>
      <a href="About.dc.html" style="{{mst.about}}">About Dr. Vira</a>
      <span style="padding: 14px 14px 4px; font-size: 13px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #B4492F">Services</span>
      <sc-for list="{{services}}" as="s" hint-placeholder-count="5">
        <a href="{{s.href}}" onMouseEnter="{{s.enter}}" onMouseLeave="{{s.leave}}" onFocus="{{s.enter}}" onBlur="{{s.leave}}" style="{{s.mItemStyle}}">{{s.title}}</a>
      </sc-for>
      <a href="Services.dc.html" style="display: flex; align-items: center; min-height: 48px; padding: 6px 14px 6px 28px; border-radius: 14px; text-decoration: none; color: #0D7A80; font-weight: 800; font-size: 16px">All Services →</a>
      <span aria-hidden="true" style="height: 1px; background: #EEF4F5; margin: 8px 0"></span>
      <a href="Book.dc.html" style="{{mst.book}}">Book an Appointment</a>
      <a href="FAQ.dc.html" style="{{mst.faq}}">FAQ</a>
      <a href="Blog.dc.html" style="{{mst.blog}}">Blog</a>
      <a href="Contact.dc.html" style="{{mst.contact}}">Contact</a>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding-top: 12px">
        <a href="tel:+639274286149" style="display: flex; flex-direction: column; justify-content: center; min-height: 58px; padding: 6px 14px; border-radius: 16px; background: #0D7A80; color: #FFFFFF; text-decoration: none; line-height: 1.25"><span style="font-size: 12px; font-weight: 700; color: #DDF2F1">Call CUMC</span><span style="font-size: 15px; font-weight: 800">0927 428 6149</span></a>
        <a href="tel:+639352894650" style="display: flex; flex-direction: column; justify-content: center; min-height: 58px; padding: 6px 14px; border-radius: 16px; background: #E6F4F3; color: #0A5F64; text-decoration: none; line-height: 1.25"><span style="font-size: 12px; font-weight: 700">Call Maria Reyna–XU</span><span style="font-size: 15px; font-weight: 800">0935 289 4650</span></a>
      </div>
    </nav>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","about","services","book","faq","blog","contact"],"default":"home"},"$preview":{"width":1440,"height":80}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { servicesOpen: false, menuOpen: false, hover: null };
  }
  renderVals() {
    const active = this.props.active ?? 'home';
    const ids = ['home', 'about', 'services', 'book', 'faq', 'blog', 'contact'];
    const base = 'padding: 10px 14px; border-radius: 999px; font-weight: 700; font-size: 15px; text-decoration: none; ';
    const mbase = 'display: flex; align-items: center; min-height: 48px; padding: 6px 14px; border-radius: 14px; text-decoration: none; font-weight: 800; font-size: 17px; ';
    const st = {}, mst = {}, cur = {};
    ids.forEach((id) => {
      const on = id === active;
      st[id] = base + (on ? 'background: #E6F4F3; color: #0A5F64;' : 'background: transparent; color: #17324D;');
      mst[id] = mbase + (on ? 'background: #E6F4F3; color: #0A5F64;' : 'color: #17324D;');
      cur[id] = on ? 'page' : 'false';
    });
    const services = [
      ['Newborn & Neonatal Care', 'Service.dc.html'],
      ['Well-Baby & Growth Monitoring', 'ServiceWellBaby.dc.html'],
      ['Child Vaccinations & Immunization', 'ServiceVaccines.dc.html'],
      ['Common Childhood Illnesses', 'ServiceIllnesses.dc.html'],
      ['High-Risk Infant Follow-up', 'ServiceHighRisk.dc.html']
    ].map(([title, href], i) => {
      const hov = this.state.hover === i;
      const look = hov ? 'background: #E6F4F3; color: #0A6F75;' : 'background: transparent; color: #17324D;';
      return {
        title, href,
        itemStyle: 'display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 8px 12px; border-radius: 14px; text-decoration: none; font-weight: 700; font-size: 15px; line-height: 1.3; transition: background 0.15s, color 0.15s; ' + look,
        mItemStyle: 'display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 6px 14px 6px 28px; border-radius: 14px; text-decoration: none; font-weight: 700; font-size: 16px; transition: background 0.15s, color 0.15s; ' + look,
        enter: () => this.setState({ hover: i }),
        leave: () => { if (this.state.hover === i) this.setState({ hover: null }); }
      };
    });
    const so = this.state.servicesOpen, mo = this.state.menuOpen;
    return {
      st, mst, cur, services,
      servicesOpen: so, servicesExpanded: so ? 'true' : 'false',
      chevStyle: 'transition: transform 0.2s; transform: rotate(' + (so ? '180' : '0') + 'deg);',
      toggleServices: () => this.setState({ servicesOpen: !so }),
      menuOpen: mo, menuClosed: !mo, menuExpanded: mo ? 'true' : 'false',
      menuLabel: mo ? 'Close menu' : 'Open menu',
      toggleMenu: () => this.setState({ menuOpen: !mo })
    };
  }
}
</script>
</body>
</html>
